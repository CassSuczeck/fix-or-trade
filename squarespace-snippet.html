      &lt;div class=&quot;disclaimer&quot;&gt;
        &lt;h3&gt;Important: this is an estimate, not an offer&lt;/h3&gt;
        &lt;p&gt;This tool gives a rough, directional comparison. It&#x27;s based on general depreciation and upkeep patterns and on what you enter. It is not a vehicle appraisal, a trade-in or purchase offer, a written repair estimate, a credit offer, or financial or legal advice. Condition, trim, options, history, market conditions and your credit all change the real numbers. Before you decide, get a written trade-in offer from a dealer and a written repair estimate.&lt;/p&gt;
        &lt;h3&gt;Costs not included&lt;/h3&gt;
        &lt;p&gt;The &quot;trade in &amp;amp; replace&quot; figure does not include New Jersey sales tax (currently 6.625%), NJ MVC title and registration fees, dealer documentary or other fees, insurance, or any loan balance you still owe on your current car. Those costs vary by vehicle, dealer and driver, and they will make buying a vehicle cost more than shown here. Insurance and registration can differ a lot between your current car and a newer one, so ask your insurer and the dealer for exact figures.&lt;/p&gt;
        &lt;h3&gt;Financing&lt;/h3&gt;
        &lt;p&gt;Payments calculated from a price, APR and term are for illustration only. Your actual rate and terms depend on your lender and credit approval.&lt;/p&gt;
        &lt;h3&gt;Rust, safety &amp;amp; recalls&lt;/h3&gt;

    }

    var scale = retentionAt(age) / retentionAt(ANCHOR_AGE);
    var expectedMileage = Math.max(1000, age*12000);
    var mileageDiff = (mileage - expectedMileage) / expectedMileage;
    var mileageFactor = 1 - clamp(mileageDiff*0.25, -0.35, 0.35);

    var swValue = swCounts ? 1 - 0.03*swIssues.length : 1;

        : [&#x27;New car&#x27;, money(parseFloat($(&#x27;price&#x27;).value)||0) + &#x27; at &#x27; + (parseFloat($(&#x27;apr&#x27;).value)||0) + &#x27;% for &#x27; + termMonths + &#x27; mo, &#x27; + money(cashDown) + &#x27; down&#x27; + (tradeCredit&gt;0 ? &#x27;, trade-in applied&#x27; : &#x27;&#x27;)],

    var mathTrade = isOther

      : &#x27;We start from a typical trade-in value for a &#x27; + makeSel.value + &#x27; &#x27; + modelSel.value + &#x27; that is 8 years old&#x27;;

      (swIssues.length ? (swCounts ? &#x27;, plus the electronics problems (3% off for each)&#x27; : &#x27; (the electronics problems don\&#x27;t lower it, since you said it\&#x27;s under warranty)&#x27;) : &#x27;&#x27;) +
      &#x27;. The range shows how much cars like yours usually vary.&#x27;;

      &#x27;, plus about &#x27; + money(maintMonthly) + &#x27; a month in upkeep over &#x27; + period + &#x27;. Upkeep starts at $70 a month, rises about $9 for each year of age past 2 (up to $230), and goes up for fair or poor condition, rust and out-of-warranty electronics problems.&#x27;;
    var mathReplace;

  // ---- print / save as PDF ----
  var detailsEls = document.querySelectorAll(&#x27;#step4 details&#x27;);

  // The PDF&#x27;s file name comes from the page title. Embedded, the browser uses the host page&#x27;s

  // print-only window with our own title and header instead.
  function printTitle(){
    return &#x27;Safe Travels Tool Results &#8211; &#x27; + new Date().toLocaleDateString(&#x27;en-US&#x27;, {year:&#x27;numeric&#x27;, month:&#x27;short&#x27;, day:&#x27;numeric&#x27;});
  }
  function printHere(){
    var oldTitle = document.title;
    document.title = printTitle();
    window.addEventListener(&#x27;afterprint&#x27;, function restore(){
      document.title = oldTitle;
      window.removeEventListener(&#x27;afterprint&#x27;, restore);
    });
    window.print();
  }
  function printInNewWindow(){
    var w = window.open(&#x27;&#x27;, &#x27;_blank&#x27;);
    if(!w) return false; // popup blocked
    var result = document.getElementById(&#x27;step4&#x27;).cloneNode(true);
    result.removeAttribute(&#x27;id&#x27;);
    Array.prototype.forEach.call(result.querySelectorAll(&#x27;details&#x27;), function(d){ d.open = true; });
    Array.prototype.forEach.call(result.querySelectorAll(&#x27;[id]&#x27;), function(el){ el.removeAttribute(&#x27;id&#x27;); });
    var head = Array.prototype.map.call(document.querySelectorAll(&#x27;head link[rel=&quot;stylesheet&quot;], head style&#x27;),
      function(el){ return el.outerHTML; }).join(&#x27;\n&#x27;);
    var header = document.querySelector(&#x27;header.top&#x27;).outerHTML;
    var doc = w.document;
    doc.open();
    doc.write(&#x27;&lt;!DOCTYPE html&gt;&lt;html lang=&quot;en&quot; data-theme=&quot;light&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&#x27; +
      &#x27;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;&lt;title&gt;&lt;/title&gt;&#x27; + head +
      &#x27;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;wrap&quot;&gt;&#x27; + header +
      &#x27;&lt;div class=&quot;title-block&quot;&gt;&lt;h1&gt;Fix it, or trade it in?&lt;/h1&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;card&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;&#x27;);
    doc.close();
    doc.title = printTitle();
    result.className = &#x27;step active&#x27;;
    doc.querySelector(&#x27;.card&#x27;).appendChild(doc.importNode(result, true));
    var go = function(){ w.focus(); w.print(); };
    w.addEventListener(&#x27;afterprint&#x27;, function(){ w.close(); });
    // Give the fonts a moment so the PDF doesn&#x27;t use fallback fonts.
    if(doc.fonts &amp;&amp; doc.fonts.ready) doc.fonts.ready.then(function(){ setTimeout(go, 150); }); else setTimeout(go, 500);
    return true;
  }
  $(&#x27;printBtn&#x27;).addEventListener(&#x27;click&#x27;, function(){
    if(EMBEDDED &amp;&amp; printInNewWindow()) return;
    printHere();
  });

  // ---- send results to Safe Travels ----
  function resultText(contact){
    var r = lastResult;
    var lines = [];
    lines.push(&#x27;Name: &#x27; + contact.name);
    lines.push(&#x27;Email: &#x27; + (contact.email || &#x27;&#8212;&#x27;));
    lines.push(&#x27;Phone: &#x27; + (contact.phone || &#x27;&#8212;&#x27;));
    if(contact.note) lines.push(&#x27;Note: &#x27; + contact.note);
    lines.push(&#x27;&#x27;);
    lines.push(&#x27;RESULT: &#x27; + r.verdict);
    lines.push(&#x27;Trade-in estimate: &#x27; + r.tradeInRange);
    lines.push(&#x27;Repair as % of value: &#x27; + r.repairRatio);
    lines.push(&#x27;Cost to keep &amp; fix: &#x27; + r.keepCost);
    lines.push(&#x27;Net cost to trade in &amp; replace: &#x27; + r.tradeCost);
    lines.push(&#x27;&#x27;);
    r.answers.forEach(function(a){ lines.push(a[0] + &#x27;: &#x27; + a[1]); });
    lines.push(&#x27;&#x27;);
    r.reasons.forEach(function(x){ lines.push(&#x27;- &#x27; + x); });
    return lines.join(&#x27;\n&#x27;);
  }

  function mailtoFallback(contact){
    var subject = &#x27;Fix or trade-in results: &#x27; + contact.name;
    return &#x27;mailto:&#x27; + CONFIG.leadEmail + &#x27;?subject=&#x27; + encodeURIComponent(subject) + &#x27;&amp;body=&#x27; + encodeURIComponent(resultText(contact));
  }

  function setStatus(cls, text, href){
    var s = $(&#x27;sendStatus&#x27;);
    s.className = &#x27;send-status &#x27; + cls;
    s.textContent = text;
    if(href){
      var a = document.createElement(&#x27;a&#x27;);
      a.href = href; a.textContent = &#x27;Email it to us instead&#x27;;
      s.appendChild(document.createTextNode(&#x27; &#x27;));
      s.appendChild(a);
    }
  }

  // ---- contact validation ----
  // Email: a normal-looking address with a real top-level domain (.com, .net, .us, &#8230;).
  // This catches typos; it can&#x27;t prove the mailbox exists.
  function checkEmail(v){
    if(!v) return {ok:true, value:&#x27;&#x27;};
    var m = /^([A-Za-z0-9!#$%&amp;&#x27;*+\/=?^_`{|}~-]+(?:\.[A-Za-z0-9!#$%&amp;&#x27;*+\/=?^_`{|}~-]+)*)@((?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,})$/.exec(v);
    if(!m || m[1].length &gt; 64) return {ok:false, msg:&#x27;Use a format like name@example.com&#x27;};
    return {ok:true, value: m[1] + &#x27;@&#x27; + m[2].toLowerCase()};
  }
  // Phone: a valid US (NANP) number, 10 digits with optional leading 1 and extension.
  // Area code and exchange can&#x27;t start with 0 or 1, and can&#x27;t be N11 codes like 911.
  function checkPhone(v){
    if(!v) return {ok:true, value:&#x27;&#x27;};
    var parts = v.split(/\s*(?:ext\.?|extension|x|#)\s*/i);
    if(parts.length &gt; 2 || /[^\d\s().+-]/.test(parts[0])) return {ok:false, msg:&#x27;Use a format like (732) 555-1234&#x27;};
    var d = parts[0].replace(/\D/g, &#x27;&#x27;);
    if(d.length === 11 &amp;&amp; d.charAt(0) === &#x27;1&#x27;) d = d.slice(1);
    if(d.length !== 10) return {ok:false, msg:&#x27;Needs 10 digits, like (732) 555-1234&#x27;};
    var area = d.slice(0,3), exch = d.slice(3,6);
    if(!/^[2-9]/.test(area) || /^.11$/.test(area)) return {ok:false, msg:&#x27;That area code isn\&#x27;t valid&#x27;};
    if(!/^[2-9]/.test(exch) || /^.11$/.test(exch)) return {ok:false, msg:&#x27;That number isn\&#x27;t valid&#x27;};
    if(/^(\d)\1{9}$/.test(d)) return {ok:false, msg:&#x27;Please enter a real phone number&#x27;};
    var ext = parts[1] ? parts[1].replace(/\D/g, &#x27;&#x27;) : &#x27;&#x27;;
    if(parts[1] !== undefined &amp;&amp; (!ext || ext.length &gt; 6)) return {ok:false, msg:&#x27;Extension should be 1&#8211;6 digits&#x27;};
    return {ok:true, value:&#x27;(&#x27; + area + &#x27;) &#x27; + exch + &#x27;-&#x27; + d.slice(6) + (ext ? &#x27; ext. &#x27; + ext : &#x27;&#x27;)};
  }
  function showFieldError(id, result){
    var input = $(id), err = $(id + &#x27;Err&#x27;);
    input.setAttribute(&#x27;aria-invalid&#x27;, result.ok ? &#x27;false&#x27; : &#x27;true&#x27;);
    err.textContent = result.ok ? &#x27;&#x27; : result.msg;
    if(result.ok &amp;&amp; result.value) input.value = result.value; // tidy the format, e.g. 7325551234 &#8594; (732) 555-1234
    return result;
  }
  // Check when the customer leaves a field, and clear the message as soon as they start fixing it,
  // so the layout doesn&#x27;t shift under their cursor when they go to press Send.
  [[&#x27;sendEmail&#x27;, checkEmail], [&#x27;sendPhone&#x27;, checkPhone]].forEach(function(f){
    $(f[0]).addEventListener(&#x27;blur&#x27;, function(){ showFieldError(f[0], f[1](this.value.trim())); });
    $(f[0]).addEventListener(&#x27;input&#x27;, function(){ showFieldError(f[0], {ok:true}); });
  });

  $(&#x27;sendForm&#x27;).addEventListener(&#x27;submit&#x27;, function(e){
    e.preventDefault();
    if(!lastResult) return;
    var contact = {
      name: $(&#x27;sendName&#x27;).value.trim(),
      email: $(&#x27;sendEmail&#x27;).value.trim(),
      phone: $(&#x27;sendPhone&#x27;).value.trim(),
      note: $(&#x27;sendNote&#x27;).value.trim()
    };
    if(!contact.name || (!contact.email &amp;&amp; !contact.phone)){
      setStatus(&#x27;bad&#x27;, &#x27;Please add your name and an email or phone number.&#x27;);
      return;
    }
    var emailCheck = showFieldError(&#x27;sendEmail&#x27;, checkEmail(contact.email));
    var phoneCheck = showFieldError(&#x27;sendPhone&#x27;, checkPhone(contact.phone));
    if(!emailCheck.ok || !phoneCheck.ok){
      setStatus(&#x27;bad&#x27;, &#x27;Please fix the &#x27; + (!emailCheck.ok &amp;&amp; !phoneCheck.ok ? &#x27;email and phone number&#x27; : (!emailCheck.ok ? &#x27;email address&#x27; : &#x27;phone number&#x27;)) + &#x27; above.&#x27;);
      $(!emailCheck.ok ? &#x27;sendEmail&#x27; : &#x27;sendPhone&#x27;).focus();
      return;
    }
    contact.email = emailCheck.value;
    contact.phone = phoneCheck.value;
    if(!$(&#x27;sendConsent&#x27;).checked){
      setStatus(&#x27;bad&#x27;, &#x27;Please check the box so we can reply to you.&#x27;);
      return;
    }
    // Bot trap: people never see this field, so anything in it means a bot filled the form.
    if($(&#x27;sendWebsite&#x27;).value){
      setStatus(&#x27;ok&#x27;, &#x27;Sent! We\&#x27;ll be in touch soon.&#x27;);
      return;
    }
    if(!CONFIG.submitEndpoint){
      window.location.href = mailtoFallback(contact);
      return;
    }

    var useAppsScript = /^https:\/\/script\.google\.com\//.test(CONFIG.submitEndpoint);
    var payload, request;
    if(useAppsScript){
      // Apps Script can&#x27;t answer a CORS preflight, so send a &quot;simple&quot; request: text/plain body
      // (still JSON inside) and no custom headers. Code.gs reads it with JSON.parse(e.postData.contents).
      payload = {
        name: contact.name,
        email: contact.email,
        phone: contact.phone,
        verdict: lastResult.verdict,
        consent: true,
        website: $(&#x27;sendWebsite&#x27;).value, // bot trap, checked again on the server
        message: resultText(contact)
      };
      request = {method:&#x27;POST&#x27;, headers:{&#x27;Content-Type&#x27;:&#x27;text/plain;charset=utf-8&#x27;}, body: JSON.stringify(payload)};
    } else {
      payload = {
        _subject: &#x27;Fix or trade-in results: &#x27; + contact.name + &#x27; (&#x27; + lastResult.verdict + &#x27;)&#x27;,
        _template: &#x27;box&#x27;,
        _captcha: &#x27;false&#x27;, // FormSubmit&#x27;s captcha needs a page redirect, which this in-page form can&#x27;t use
        _honey: &#x27;&#x27;,
        name: contact.name,
        email: contact.email,
        phone: contact.phone,
        message: resultText(contact)
      };
      if(contact.email) payload._replyto = contact.email;
      request = {method:&#x27;POST&#x27;, headers:{&#x27;Content-Type&#x27;:&#x27;application/json&#x27;, &#x27;Accept&#x27;:&#x27;application/json&#x27;}, body: JSON.stringify(payload)};
    }

    var btn = $(&#x27;sendBtn&#x27;);
    btn.disabled = true;
    setStatus(&#x27;ok&#x27;, &#x27;Sending&#8230;&#x27;);
    fetch(CONFIG.submitEndpoint, request).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(body){
        // Apps Script answers {success:true}; FormSubmit answers {success:&quot;true&quot;}.
        if(!res.ok || !(body.success === true || body.success === &#x27;true&#x27;)) throw new Error(body.message || &#x27;Send failed&#x27;);
      });
    }).then(function(){
      setStatus(&#x27;ok&#x27;, &#x27;Sent! We\&#x27;ll be in touch soon.&#x27;);
    }).catch(function(){
      setStatus(&#x27;bad&#x27;, &#x27;We couldn\&#x27;t send that automatically.&#x27;, mailtoFallback(contact));
      btn.disabled = false;
    });
  });

})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>
<script>
(function () {
  var frame = document.querySelector('#st-fix-or-trade iframe');
  window.addEventListener('message', function (e) {
    if (!frame || e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'st-fix-or-trade-height' && e.data.height > 0) frame.style.height = e.data.height + 'px';
    if (e.data.type === 'st-fix-or-trade-scroll') {
      var top = frame.getBoundingClientRect().top;
      if (top < 0) window.scrollBy({ top: top - 90, behavior: 'smooth' });
    }
  });
})();
</script>
