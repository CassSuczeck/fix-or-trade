      &lt;div class=&quot;disclaimer&quot;&gt;
        &lt;h3&gt;Important: this is an estimate, not an offer&lt;/h3&gt;
        &lt;p&gt;This tool gives a rough, directional comparison. It&#x27;s based on general depreciation and upkeep patterns and on what you enter. It is not a vehicle appraisal, a trade-in or purchase offer, a written repair estimate, a credit offer, or financial or legal advice. Condition, trim, options, history, market conditions and your credit all change the real numbers. Before you decide, get a written trade-in offer from a dealer and a written repair estimate.&lt;/p&gt;
        &lt;h3&gt;Costs not included&lt;/h3&gt;
        &lt;p&gt;The &quot;trade in &amp;amp; replace&quot; figure does not include New Jersey sales tax (currently 6.625%), NJ MVC title and registration fees, dealer documentary or other fees, insurance, or any loan balance you still owe on your current car. Those costs vary by vehicle, dealer and driver, and they will make buying a vehicle cost more than shown here. Insurance and registration can differ a lot between your current car and a newer one, so ask your insurer and the dealer for exact figures.&lt;/p&gt;
        &lt;h3&gt;Financing&lt;/h3&gt;
        &lt;p&gt;Payments calculated from a price, APR and term are for illustration only. Your actual rate and terms depend on your lender and credit approval.&lt;/p&gt;
        &lt;h3&gt;Rust, safety &amp;amp; recalls&lt;/h3&gt;

    if(noRepair.checked) $(&#x27;repairCost&#x27;).value = 0;
  });

  // payment/price toggle
  var tabPayment = $(&#x27;tabPayment&#x27;);
  var tabPrice = $(&#x27;tabPrice&#x27;);
  var paymentMode = $(&#x27;paymentMode&#x27;);
  var priceMode = $(&#x27;priceMode&#x27;);
  var mode = &#x27;payment&#x27;;
  tabPayment.addEventListener(&#x27;click&#x27;, function(){
    mode=&#x27;payment&#x27;; tabPayment.classList.add(&#x27;active&#x27;); tabPrice.classList.remove(&#x27;active&#x27;);
    paymentMode.style.display=&#x27;block&#x27;; priceMode.style.display=&#x27;none&#x27;;
  });
  tabPrice.addEventListener(&#x27;click&#x27;, function(){
    mode=&#x27;price&#x27;; tabPrice.classList.add(&#x27;active&#x27;); tabPayment.classList.remove(&#x27;active&#x27;);
    priceMode.style.display=&#x27;block&#x27;; paymentMode.style.display=&#x27;none&#x27;;
  });

  var horizonInput = $(&#x27;horizon&#x27;);
  var horizonOut = $(&#x27;horizonOut&#x27;);
  function yearsText(months){
    var yrs = months/12;
    return (yrs % 1 === 0 ? yrs : yrs.toFixed(1)) + (yrs===1 ? &#x27; year&#x27; : &#x27; years&#x27;);
  }
  function renderHorizon(){ horizonOut.textContent = yearsText(parseInt(horizonInput.value,10)); }
  horizonInput.addEventListener(&#x27;input&#x27;, renderHorizon);
  renderHorizon();

  // sync horizon default to term entered
  $(&#x27;knownTerm&#x27;).addEventListener(&#x27;change&#x27;, function(){
    if(mode===&#x27;payment&#x27;){ horizonInput.value = clamp(parseInt(this.value,10)||36,12,84); renderHorizon(); }
  });
  $(&#x27;term&#x27;).addEventListener(&#x27;change&#x27;, function(){
    if(mode===&#x27;price&#x27;){ horizonInput.value = clamp(parseInt(this.value,10)||60,12,84); renderHorizon(); }
  });

  $(&#x27;next3&#x27;).addEventListener(&#x27;click&#x27;, function(){
    var err = $(&#x27;err3&#x27;);
    if(mode===&#x27;payment&#x27;){
      var p = parseFloat($(&#x27;knownPayment&#x27;).value);
      if(!p || p&lt;=0){ err.style.display=&#x27;block&#x27;; return; }
    } else {
      var price = parseFloat($(&#x27;price&#x27;).value);
      if(!price || price&lt;=0){ err.style.display=&#x27;block&#x27;; return; }
    }
    err.style.display=&#x27;none&#x27;;
    computeAndShow();
    showStep(4);
  });

  $(&#x27;restart&#x27;).addEventListener(&#x27;click&#x27;, function(){
    var keep = {knownTerm:1, term:1, apr:1, knownDown:1, down:1};
    document.querySelectorAll(&#x27;input[type=text], input[type=number], input[type=email], input[type=tel], textarea&#x27;).forEach(function(i){
      if(!keep[i.id]) i.value=&#x27;&#x27;;
    });
    $(&#x27;knownDown&#x27;).value = 0; $(&#x27;down&#x27;).value = 0;
    document.querySelector(&#x27;input[name=cond][value=good]&#x27;).checked = true;
    document.querySelector(&#x27;input[name=rust][value=none]&#x27;).checked = true;
    swBoxes.forEach(function(b){ b.checked=false; });
    $(&#x27;warranty&#x27;).value = &#x27;unsure&#x27;;
    refreshWarranty();
    noRepair.checked=false;
    repairField.style.display=&#x27;block&#x27;;
    $(&#x27;paymentHasTrade&#x27;).checked=false;
    $(&#x27;applyTrade&#x27;).checked=true;
    $(&#x27;sendConsent&#x27;).checked=false;
    $(&#x27;sendStatus&#x27;).className=&#x27;send-status&#x27;;
    showStep(0);
  });

  function money(n){
    return (n&lt;0 ? &#x27;&#8722;$&#x27; : &#x27;$&#x27;) + Math.abs(Math.round(n)).toLocaleString(&#x27;en-US&#x27;);
  }

  var lastResult = null;

  function computeAndShow(){
    var year = parseInt($(&#x27;year&#x27;).value,10);
    var mileage = parseInt($(&#x27;mileage&#x27;).value,10);
    var currentYear = new Date().getFullYear();
    var age = Math.max(0, currentYear - year);

    // ---- base value ----
    var low, high, conf, seg, isOther=false, carName;
    if(makeSel.value === &#x27;__other__&#x27;){
      isOther = true;
      seg = categorySel.value;
      low = SEGMENTS[seg].base*0.8; high = SEGMENTS[seg].base*1.2; conf = &#x27;Low&#x27;;
      carName = year + &#x27; &#x27; + SEGMENTS[seg].label.toLowerCase();
    } else {
      var ref = lookup(makeSel.value, modelSel.value);
      low = ref.low; high = ref.high; conf = ref.conf; seg = ref.seg;
      carName = year + &#x27; &#x27; + makeSel.value + &#x27; &#x27; + modelSel.value;
    }

    var scale = retentionAt(age) / retentionAt(ANCHOR_AGE);
    var expectedMileage = Math.max(1000, age*12000);
    var mileageDiff = (mileage - expectedMileage) / expectedMileage;
    var mileageFactor = 1 - clamp(mileageDiff*0.25, -0.35, 0.35);

    // ---- condition ----
    var cond = CONDITION[document.querySelector(&#x27;input[name=cond]:checked&#x27;).value];
    var rust = RUST[document.querySelector(&#x27;input[name=rust]:checked&#x27;).value];
    var swIssues = Array.prototype.filter.call(swBoxes, function(b){ return b.checked; }).map(function(b){ return b.value; });
    var warranty = $(&#x27;warranty&#x27;).value;
    var swCounts = swIssues.length&gt;0 &amp;&amp; warranty!==&#x27;yes&#x27;;
    var swValue = swCounts ? 1 - 0.03*swIssues.length : 1;
    var conditionFactor = cond.value * rust.value * swValue;

    var finalLow = Math.max(300, low*scale*mileageFactor*conditionFactor);
    var finalHigh = Math.max(finalLow+200, high*scale*mileageFactor*conditionFactor);
    var tradeMid = (finalLow+finalHigh)/2;

    var confOrder = [&quot;High&quot;,&quot;Medium&quot;,&quot;Low&quot;];
    var confIdx = confOrder.indexOf(conf);
    if(isOther || Math.abs(age-ANCHOR_AGE)&gt;4 || Math.abs(mileageDiff)&gt;0.5 || rust.pts&gt;0) confIdx = Math.min(2, confIdx+1);
    var finalConf = confOrder[confIdx];

    // ---- repair ----
    var repairCost = noRepair.checked ? 0 : (parseFloat($(&#x27;repairCost&#x27;).value) || 0);
    var ratio = tradeMid&gt;0 ? (repairCost/tradeMid) : 0;

    // ---- keeping the current car ----
    var horizonMonths = parseInt(horizonInput.value,10);
    var maintBase = clamp(70 + 9*Math.max(0, age-2), 70, 230);
    var swUpkeep = swCounts ? 20*swIssues.length : 0;
    var maintMonthly = maintBase*cond.upkeep + rust.upkeep + swUpkeep;
    var fixTotal = repairCost + maintMonthly*horizonMonths;

    // ---- trading in &amp; replacing ----
    var monthlyPay, termMonths, cashDown, tradeCredit, tradeNote;
    if(mode===&#x27;payment&#x27;){
      monthlyPay = parseFloat($(&#x27;knownPayment&#x27;).value)||0;
      termMonths = parseInt($(&#x27;knownTerm&#x27;).value,10) || horizonMonths;
      cashDown = parseFloat($(&#x27;knownDown&#x27;).value)||0;
      // If the payment doesn&#x27;t already reflect the trade-in, the dealer&#x27;s credit comes back to you.
      tradeCredit = $(&#x27;paymentHasTrade&#x27;).checked ? 0 : tradeMid;
      tradeNote = tradeCredit&gt;0 ? &#x27;minus &#x27; + money(tradeCredit) + &#x27; trade-in&#x27; : &#x27;trade-in already in your payment&#x27;;
    } else {
      var price = parseFloat($(&#x27;price&#x27;).value)||0;
      cashDown = parseFloat($(&#x27;down&#x27;).value)||0;
      var apr = parseFloat($(&#x27;apr&#x27;).value)||0;
      termMonths = parseInt($(&#x27;term&#x27;).value,10) || horizonMonths;
      tradeCredit = $(&#x27;applyTrade&#x27;).checked ? tradeMid : 0;
      var principal = Math.max(0, price - cashDown - tradeCredit);
      var r = apr/100/12;
      monthlyPay = principal===0 ? 0 : (r===0 ? principal/termMonths : principal*r*Math.pow(1+r,termMonths)/(Math.pow(1+r,termMonths)-1));
      tradeNote = tradeCredit&gt;0 ? money(tradeCredit) + &#x27; trade-in lowers the loan&#x27; : &#x27;trade-in not applied&#x27;;
    }
    var coveredMonths = Math.min(horizonMonths, termMonths);
    var paymentsTotal = monthlyPay*coveredMonths;
    var afterTermUpkeep = horizonMonths&gt;termMonths ? 40*(horizonMonths-termMonths) : 0; // light upkeep once paid off / lease ended
    var tradeGross = cashDown + paymentsTotal + afterTermUpkeep;
    // In price mode the credit is already inside the loan; in payment mode subtract it here.
    var tradeTotal = mode===&#x27;payment&#x27; ? tradeGross - tradeCredit : tradeGross;
    if(mode===&#x27;price&#x27; &amp;&amp; tradeCredit &gt; price - cashDown) tradeTotal -= (tradeCredit - Math.max(0, price - cashDown));

    var diff = tradeTotal - fixTotal;

    // ---- scoring ----
    var points = 0;
    if(ratio&gt;0.6) points+=2; else if(ratio&gt;0.35) points+=1; else if(ratio&lt;0.15) points-=1;
    if(diff&lt;0) points+=2; else if(diff &lt; fixTotal*0.25) points+=1; else if(diff &gt; fixTotal*1.5) points-=1;
    if(age&gt;=12 &amp;&amp; mileage &gt; age*12000*1.3) points+=1;
    if(repairCost===0) points-=1;
    points += cond.pts + rust.pts;
    if(swCounts &amp;&amp; swIssues.length&gt;=2) points+=1;

    var isTrade = points&gt;0;

    // ---- render ----
    var period = yearsText(horizonMonths);
    $(&#x27;statTradeIn&#x27;).textContent = money(finalLow)+&#x27; &#8211; &#x27;+money(finalHigh);
    $(&#x27;statTradeInConf&#x27;).textContent = finalConf+&#x27; confidence&#x27; + (isOther ? &#x27; &#183; category estimate&#x27; : &#x27;&#x27;);
    $(&#x27;statRatio&#x27;).textContent = tradeMid&gt;0 ? Math.round(ratio*100)+&#x27;%&#x27; : &#x27;&#8212;&#x27;;
    $(&#x27;statFixTotal&#x27;).textContent = money(fixTotal);
    $(&#x27;statFixSub&#x27;).textContent = &#x27;repair + upkeep over &#x27; + period;
    $(&#x27;statTradeTotal&#x27;).textContent = money(tradeTotal);
    $(&#x27;statTradeSub&#x27;).textContent = &#x27;over &#x27; + period + &#x27;, &#x27; + tradeNote;

    var verdictCard = $(&#x27;verdictCard&#x27;);
    var headline = $(&#x27;verdictHeadline&#x27;);
    var sub = $(&#x27;verdictSub&#x27;);
    var resultCta = $(&#x27;resultCta&#x27;);
    var resultCtaText = $(&#x27;resultCtaText&#x27;);

    if(isTrade){
      verdictCard.className = &#x27;verdict-card trade&#x27;;
      headline.textContent = &#x27;Trade it in&#x27;;
      sub.textContent = rust.pts===2
        ? &#x27;Structural rust changes the picture. It\&#x27;s a safety issue, and it\&#x27;s rarely worth putting big money into.&#x27;
        : &#x27;The math leans toward moving on. Repairs and upkeep are eating into what this car is still worth.&#x27;;
      resultCta.href = &#x27;https://www.besafetravels.com/calculator&#x27;;
      resultCtaText.textContent = &#x27;Get a pre-trade inspection first&#x27;;
    } else {
      verdictCard.className = &#x27;verdict-card fix&#x27;;
      headline.textContent = &#x27;Fix it&#x27;;
      sub.textContent = &#x27;Keeping and repairing your current car looks like the stronger financial move right now.&#x27;;
      resultCta.href = &#x27;https://www.besafetravels.com&#x27;;
      resultCtaText.textContent = &#x27;Book your repair with Safe Travels&#x27;;
    }

    // reasoning bullets
    var reasons = [];
    reasons.push(&#x27;Your &#x27; + carName + &#x27; in &#x27; + cond.label.toLowerCase() + &#x27; condition is estimated to be worth &#x27; + money(finalLow) + &#x27;&#8211;&#x27; + money(finalHigh) + &#x27; at trade-in.&#x27;);
    if(rust.pts===2){
      reasons.push(&#x27;Frame or brake-line rust lowers the value a lot, and it can make the car unsafe. Have it inspected before you pay for other repairs.&#x27;);
    } else if(rust.pts===1){
      reasons.push(&#x27;Body rust lowers the trade-in value and tends to spread, especially with NJ road salt. We\&#x27;ve added extra upkeep for it.&#x27;);
    }
    if(swIssues.length&gt;0){
      reasons.push(warranty===&#x27;yes&#x27;
        ? &#x27;Your electronics or software problems may be fixed free under warranty or a recall. Ask the dealer before paying for them.&#x27;
        : &#x27;Ongoing electronics or software problems can be costly to chase down out of warranty. We\&#x27;ve lowered the value and raised upkeep to reflect that. Check nhtsa.gov/recalls for free fixes.&#x27;);
    }
    if(repairCost&gt;0){
      reasons.push(&#x27;The &#x27; + money(repairCost) + &#x27; repair is about &#x27; + Math.round(ratio*100) + &#x27;% of that estimated value.&#x27;);
    } else {
      reasons.push(&#x27;You don\&#x27;t have a specific repair on the table right now, so this compares typical upkeep against replacing the car.&#x27;);
    }
    reasons.push(&#x27;Keeping the car (repair + about &#x27; + money(maintMonthly) + &#x27;/month upkeep) runs about &#x27; + money(fixTotal) + &#x27; over &#x27; + period + &#x27;.&#x27;);
    if(mode===&#x27;payment&#x27;){
      reasons.push(&#x27;Replacing it runs about &#x27; + money(tradeGross) + &#x27; in cash down and payments&#x27; + (tradeCredit&gt;0 ? &#x27;, minus the &#x27; + money(tradeCredit) + &#x27; you\&#x27;d get for your trade-in, for a net &#x27; + money(tradeTotal) : &#x27;&#x27;) + &#x27; over the same period.&#x27;);
    } else {
      reasons.push(&#x27;Replacing it runs about &#x27; + money(tradeTotal) + &#x27; over the same period (&#x27; + money(cashDown) + &#x27; down + &#x27; + money(monthlyPay) + &#x27;/month&#x27; + (tradeCredit&gt;0 ? &#x27;, after your &#x27; + money(tradeCredit) + &#x27; trade-in lowers the loan&#x27; : &#x27;&#x27;) + &#x27;).&#x27;);
    }
    if(age&gt;=12 &amp;&amp; mileage &gt; age*12000*1.3){
      reasons.push(&#x27;Higher-than-typical mileage for its age adds some reliability risk to factor in.&#x27;);
    }
    if(seg===&#x27;exotic&#x27;){
      reasons.push(&#x27;Exotic and collectible cars vary widely. Get a specialist appraisal before you rely on this estimate.&#x27;);
    }
    var list = $(&#x27;reasoningList&#x27;);
    list.innerHTML=&#x27;&#x27;;
    reasons.forEach(function(r){
      var li = document.createElement(&#x27;li&#x27;);
      var dot = document.createElement(&#x27;span&#x27;); dot.className=&#x27;dot&#x27;;
      var txt = document.createElement(&#x27;span&#x27;); txt.textContent = r;
      li.appendChild(dot); li.appendChild(txt);
      list.appendChild(li);
    });

    // answers summary (screen, print and email)
    var answers = [
      [&#x27;Car&#x27;, carName],
      [&#x27;Mileage&#x27;, mileage.toLocaleString(&#x27;en-US&#x27;)],
      [&#x27;VIN / plate&#x27;, $(&#x27;platevin&#x27;).value.trim() || &#x27;&#8212;&#x27;],
      [&#x27;Condition&#x27;, cond.label],
      [&#x27;Rust&#x27;, rust.label],
      [&#x27;Electronics / software&#x27;, swIssues.length ? swIssues.join(&#x27;; &#x27;) : &#x27;No problems reported&#x27;],
      [&#x27;Repair quote&#x27;, repairCost&gt;0 ? money(repairCost) : &#x27;None&#x27;],
      mode===&#x27;payment&#x27;
        ? [&#x27;New car&#x27;, money(monthlyPay) + &#x27;/mo for &#x27; + termMonths + &#x27; mo, &#x27; + money(cashDown) + &#x27; down&#x27; + ($(&#x27;paymentHasTrade&#x27;).checked ? &#x27;, trade-in included&#x27; : &#x27;&#x27;)]
        : [&#x27;New car&#x27;, money(parseFloat($(&#x27;price&#x27;).value)||0) + &#x27; at &#x27; + (parseFloat($(&#x27;apr&#x27;).value)||0) + &#x27;% for &#x27; + termMonths + &#x27; mo, &#x27; + money(cashDown) + &#x27; down&#x27; + (tradeCredit&gt;0 ? &#x27;, trade-in applied&#x27; : &#x27;&#x27;)],
      [&#x27;Comparing over&#x27;, period]
    ];
    if(swIssues.length) answers.splice(6, 0, [&#x27;Under warranty&#x27;, {yes:&#x27;Yes&#x27;, no:&#x27;No&#x27;, unsure:&#x27;Not sure&#x27;}[warranty]]);
    var al = $(&#x27;answersList&#x27;);
    al.innerHTML = &#x27;&#x27;;
    answers.forEach(function(a){
      var li = document.createElement(&#x27;li&#x27;);
      var k = document.createElement(&#x27;span&#x27;); k.textContent = a[0];
      var v = document.createElement(&#x27;span&#x27;); v.textContent = a[1];
      li.appendChild(k); li.appendChild(v); al.appendChild(li);
    });

    $(&#x27;mathBody&#x27;).innerHTML =
      &#x27;&lt;p&gt;&lt;strong&gt;Trade-in estimate:&lt;/strong&gt; starts from a reference value for that model (or its vehicle category) as an 8-year-old car, adjusted for age with a typical depreciation curve, for mileage compared with what\&#x27;s expected at that age, and for the condition, rust and electronics problems you reported.&lt;/p&gt;&#x27; +
      &#x27;&lt;p&gt;&lt;strong&gt;Cost to keep &amp;amp; fix:&lt;/strong&gt; your repair quote, plus an estimated &#x27; + money(maintMonthly) + &#x27;/month in upkeep for a car this age and condition, over the comparison period.&lt;/p&gt;&#x27; +
      &#x27;&lt;p&gt;&lt;strong&gt;Net cost to trade in &amp;amp; replace:&lt;/strong&gt; cash down plus monthly payments over the comparison period (payments are entered directly, or calculated from price, APR and term), minus the estimated value of your trade-in. It does not include sales tax, MVC fees or insurance.&lt;/p&gt;&#x27; +
      &#x27;&lt;p&gt;Every real car differs by condition, region, and trim. Treat this as a starting point for the conversation, not a final number.&lt;/p&gt;&#x27;;

    $(&#x27;printDate&#x27;).textContent = &#x27;Prepared &#x27; + new Date().toLocaleDateString(&#x27;en-US&#x27;, {year:&#x27;numeric&#x27;, month:&#x27;long&#x27;, day:&#x27;numeric&#x27;}) + &#x27; at besafetravels.com&#x27;;

    lastResult = {
      verdict: isTrade ? &#x27;Trade it in&#x27; : &#x27;Fix it&#x27;,
      answers: answers,
      tradeInRange: money(finalLow) + &#x27; &#8211; &#x27; + money(finalHigh) + &#x27; (&#x27; + finalConf + &#x27; confidence)&#x27;,
      repairRatio: tradeMid&gt;0 ? Math.round(ratio*100)+&#x27;%&#x27; : &#x27;&#8212;&#x27;,
      keepCost: money(fixTotal),
      tradeCost: money(tradeTotal),
      reasons: reasons
    };
  }

  // ---- print / save as PDF ----
  var detailsEls = document.querySelectorAll(&#x27;#step4 details&#x27;);
  var openBeforePrint = [];
  window.addEventListener(&#x27;beforeprint&#x27;, function(){
    openBeforePrint = Array.prototype.map.call(detailsEls, function(d){ return d.open; });
    detailsEls.forEach(function(d){ d.open = true; });
  });
  window.addEventListener(&#x27;afterprint&#x27;, function(){
    detailsEls.forEach(function(d, i){ d.open = openBeforePrint[i]; });
  });
  $(&#x27;printBtn&#x27;).addEventListener(&#x27;click&#x27;, function(){ window.print(); });

  // ---- send results to Safe Travels ----
  function resultText(contact){
    var r = lastResult;
    var lines = [];
    lines.push(&#x27;Name: &#x27; + contact.name);
    lines.push(&#x27;Email: &#x27; + (contact.email || &#x27;&#8212;&#x27;));
    lines.push(&#x27;Phone: &#x27; + (contact.phone || &#x27;&#8212;&#x27;));
    if(contact.note) lines.push(&#x27;Note: &#x27; + contact.note);
    lines.push(&#x27;&#x27;);
    lines.push(&#x27;RESULT: &#x27; + r.verdict);
    lines.push(&#x27;Trade-in estimate: &#x27; + r.tradeInRange);
    lines.push(&#x27;Repair as % of value: &#x27; + r.repairRatio);
    lines.push(&#x27;Cost to keep &amp; fix: &#x27; + r.keepCost);
    lines.push(&#x27;Net cost to trade in &amp; replace: &#x27; + r.tradeCost);
    lines.push(&#x27;&#x27;);
    r.answers.forEach(function(a){ lines.push(a[0] + &#x27;: &#x27; + a[1]); });
    lines.push(&#x27;&#x27;);
    r.reasons.forEach(function(x){ lines.push(&#x27;- &#x27; + x); });
    return lines.join(&#x27;\n&#x27;);
  }

  function mailtoFallback(contact){
    var subject = &#x27;Fix or trade-in results: &#x27; + contact.name;
    return &#x27;mailto:&#x27; + CONFIG.leadEmail + &#x27;?subject=&#x27; + encodeURIComponent(subject) + &#x27;&amp;body=&#x27; + encodeURIComponent(resultText(contact));
  }

  function setStatus(cls, text, href){
    var s = $(&#x27;sendStatus&#x27;);
    s.className = &#x27;send-status &#x27; + cls;
    s.textContent = text;
    if(href){
      var a = document.createElement(&#x27;a&#x27;);
      a.href = href; a.textContent = &#x27;Email it to us instead&#x27;;
      s.appendChild(document.createTextNode(&#x27; &#x27;));
      s.appendChild(a);
    }
  }

  $(&#x27;sendForm&#x27;).addEventListener(&#x27;submit&#x27;, function(e){
    e.preventDefault();
    if(!lastResult) return;
    var contact = {
      name: $(&#x27;sendName&#x27;).value.trim(),
      email: $(&#x27;sendEmail&#x27;).value.trim(),
      phone: $(&#x27;sendPhone&#x27;).value.trim(),
      note: $(&#x27;sendNote&#x27;).value.trim()
    };
    if(!contact.name || (!contact.email &amp;&amp; !contact.phone)){
      setStatus(&#x27;bad&#x27;, &#x27;Please add your name and an email or phone number.&#x27;);
      return;
    }
    if(contact.email &amp;&amp; !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email)){
      setStatus(&#x27;bad&#x27;, &#x27;That email address doesn\&#x27;t look right.&#x27;);
      return;
    }
    if(!$(&#x27;sendConsent&#x27;).checked){
      setStatus(&#x27;bad&#x27;, &#x27;Please check the box so we can reply to you.&#x27;);
      return;
    }
    if(!CONFIG.submitEndpoint){
      window.location.href = mailtoFallback(contact);
      return;
    }

    var payload = {
      _subject: &#x27;Fix or trade-in results: &#x27; + contact.name + &#x27; (&#x27; + lastResult.verdict + &#x27;)&#x27;,
      _template: &#x27;box&#x27;,
      _captcha: &#x27;false&#x27;,
      name: contact.name,
      email: contact.email,
      phone: contact.phone,
      message: resultText(contact)
    };
    if(contact.email) payload._replyto = contact.email;

    var btn = $(&#x27;sendBtn&#x27;);
    btn.disabled = true;
    setStatus(&#x27;ok&#x27;, &#x27;Sending&#8230;&#x27;);
    fetch(CONFIG.submitEndpoint, {
      method: &#x27;POST&#x27;,
      headers: {&#x27;Content-Type&#x27;:&#x27;application/json&#x27;, &#x27;Accept&#x27;:&#x27;application/json&#x27;},
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(body){
        if(!res.ok || body.success === false || body.success === &#x27;false&#x27;) throw new Error(body.message || &#x27;Send failed&#x27;);
      });
    }).then(function(){
      setStatus(&#x27;ok&#x27;, &#x27;Sent! We\&#x27;ll be in touch soon.&#x27;);
    }).catch(function(){
      setStatus(&#x27;bad&#x27;, &#x27;We couldn\&#x27;t send that automatically.&#x27;, mailtoFallback(contact));
      btn.disabled = false;
    });
  });

})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>

<script>
(function () {
  var frame = document.querySelector('#st-fix-or-trade iframe');
  window.addEventListener('message', function (e) {
    if (!frame || e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'st-fix-or-trade-height' && e.data.height > 0) frame.style.height = e.data.height + 'px';
    if (e.data.type === 'st-fix-or-trade-scroll') {
      var top = frame.getBoundingClientRect().top;
      if (top < 0) window.scrollBy({ top: top - 90, behavior: 'smooth' });
    }
  });
})();
</script>
